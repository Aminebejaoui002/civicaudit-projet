spring.application.name=civicaudit-backend

# ---------------------------------------------------------------------------
# Aucun secret n'est versionné dans ce fichier (CDC 4 - sécurité).
# Les valeurs viennent des variables d'environnement, ou en développement du fichier
# application-local.properties (ignoré par Git, voir application-local.properties.example).
# ---------------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

# --- Base de données PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civicaudit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (durée de validité 24h, CDC 3.6) ---
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Import DECP (CDC 3.1) ---
# Fichier importé automatiquement au démarrage (optionnel : l'import se fait normalement via POST /api/admin/import)
civicaudit.import.file=${IMPORT_FILE_PATH:}
# SIRET de l'acheteur retenu (CDC 1.4) ; vide = pas de filtrage (fichier déjà filtré sur la commune)
civicaudit.import.acheteur-id=${ACHETEUR_ID:}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Compte administrateur initial (créé au démarrage s'il n'existe pas) ---
civicaudit.admin.email=${ADMIN_EMAIL:admin@civicaudit.tn}
civicaudit.admin.password=${ADMIN_PASSWORD:}

# --- Anti-spam : actions (commentaires + signalements + votes) par utilisateur et par heure (CDC 4) ---
civicaudit.anti-spam.max-actions-par-heure=10
