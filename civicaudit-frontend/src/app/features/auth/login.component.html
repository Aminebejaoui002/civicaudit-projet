<div class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <h1>Connexion</h1>
      <p>Connectez-vous pour commenter et signaler des marchés publics</p>
    </div>

    <div *ngIf="erreur" class="alerte-erreur">
      {{ erreur }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          placeholder="votre@email.fr"
        />
        <span class="error-message" *ngIf="getErrorMessage('email')">
          {{ getErrorMessage('email') }}
        </span>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          placeholder="••••••••"
        />
        <span class="error-message" *ngIf="getErrorMessage('password')">
          {{ getErrorMessage('password') }}
        </span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="chargement">
        {{ chargement ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>
        Pas encore de compte ? 
        <a routerLink="/register">Créer un compte</a>
      </p>
      <p>
        <a routerLink="/marches">Continuer sans compte</a>
      </p>
    </div>
  </div>
</div>
